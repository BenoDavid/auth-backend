services:
  postgres:
    image: postgres:16-alpine
    container_name: authguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-authguard}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-authguard_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - authguard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    profiles: ["container"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-authguard}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-authguard_dev_password}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      APP_VERSION: ${APP_VERSION:-2.0.0}
    ports:
      - "${PORT:-8082}:8082"

volumes:
  authguard-postgres-data:
